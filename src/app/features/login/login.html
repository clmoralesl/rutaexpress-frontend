<main class="login-layout" role="main">
  <div class="login-tarjeta">
    <div class="icono-marca">R</div>
    <h1 class="titulo-login">RutaExpress</h1>
    <p class="estado-login">Redirigiendo a inicio de sesión con Microsoft...</p>
    <div class="indicador-carga" aria-hidden="true"></div>
    <p class="nota-espera">
      Si la redirección no inicia automáticamente, puedes presionar el siguiente botón:
    </p>
    <button
      type="button"
      class="btn-acceso"
      (click)="iniciarSesionManual()">
      Iniciar sesión con Microsoft
    </button>
  </div>
</main>
