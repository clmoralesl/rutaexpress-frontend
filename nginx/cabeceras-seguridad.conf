# Cabeceras de seguridad del frontend (issue #74).
# Se incluye en cada location que define add_header propio, porque en nginx
# un add_header dentro de un location anula los heredados del server.
# HSTS se emite en el proxy de borde (infra/nginx), donde termina TLS.
# Antes de pasar a Content-Security-Policy obligatoria, reemplazar el comodin de connect-src por el origen exacto del API Gateway.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://login.microsoftonline.com https://*.execute-api.us-east-1.amazonaws.com; frame-src https://login.microsoftonline.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
